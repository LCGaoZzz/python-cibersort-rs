name: Release wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheels:
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: "off"
          - os: macos-15-intel
            target: x86_64
            manylinux: "off"
          - os: macos-15
            target: aarch64
            manylinux: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release --out dist ${{ matrix.os == 'ubuntu-latest' && format('-i python{0}', matrix.python) || '' }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.target }}
          path: dist/*

  source:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          python -m pip install "maturin>=1.7,<2"
          maturin sdist --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: source-distribution
          path: dist/*

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
