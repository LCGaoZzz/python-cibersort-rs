[package]
name = "python-cibersort-rs-native"
version = "0.1.0"
edition = "2021"
description = "Native accelerator for python-cibersort-rs"
license = "GPL-3.0-or-later"
repository = "https://github.com/LCGaoZzz/python-cibersort-rs"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
